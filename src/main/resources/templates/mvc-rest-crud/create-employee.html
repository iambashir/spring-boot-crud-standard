<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Employee</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container fw-bold mt-3 mb-3">
    <h5 class="mt-4">Create Employee</h5>
    <hr>
    <form th:object="${employeeDto}" th:action="@{/employees/add}" method="post">
        <div class="mb-3">
            <label class="form-label">First Name</label>
            <input type="text" class="form-control" th:field="*{firstName}" />
        </div>
        <div class="mb-3">
            <label class="form-label">Last Name</label>
            <input type="text" class="form-control" th:field="*{lastName}" />
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" th:field="*{email}" />
        </div>
        <h5 class="mt-4">Address</h5>
        <hr>
        <div class="mb-3">
            <label class="form-label">Location</label>
            <input type="text" class="form-control" th:field="*{empAddress[0].location}" />
        </div>
        <div class="mb-3">
            <label class="form-label">Home District</label>
            <input type="text" class="form-control" th:field="*{empAddress[0].homeDistrict}" />
        </div>
        <div class="mb-3">
            <label class="form-label">Zip Code</label>
            <input type="text" class="form-control" th:field="*{empAddress[0].zipCode}" />
        </div>
        <button type="submit" class="btn btn-primary">Save</button>
        <a class="btn btn-secondary" th:href="@{/employees/list}">Back to Employee List</a>
    </form>

</div>
</body>
</html>
